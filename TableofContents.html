<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents</title>
</head>
<body>
    <!-- 
        24. HTML Page with Table of Contents
        Description
        This project demonstrates how to create a table of contents (TOC) that links to sections within the same HTML page. It’s useful for documentation, guides, long articles, or tutorials.
        Features
        •	Clickable internal links (anchor links)
        •	Organized sections with corresponding IDs
        •	Semantic headings for structure and accessibility
    -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between; /* Pushes logo and links to opposite ends */
            align-items: center;            /* Centers items vertically */
            padding: 15px 30px;
            color: black;
        }

        .nav-links {
            display: flex;
            gap: 20px;                      /* Creates even space between each link */
        }

        .navbar a {
            color: black;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        .navbar a:hover {
            color: #00bcd4;                 /* Changes color when you hover over a link */
        }
        div {
            text-align: center;
            height: 100vh;
        }
        #section1 {
            padding: 50px;
            border: 1px solid blue;
            background-color: lightblue;
            margin: 20px 0;
        }
        #section2{
            padding: 50px;
            border: 1px solid red;
            background-color: lightcoral;
            margin: 20px 0;
        }
        #section3{
            padding: 50px;
            border: 1px solid green;
            background-color: lightgreen;
            margin: 20px 0;
        }
    </style>
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <div class="nav-links">
            <a href="#navbar">Home</a>
            <a href="#section1">About</a>
            <a href="#section2">Services</a>
            <a href="#section3">Contact</a>
        </div>
    </nav>

    <div id="section1">
        <h2>Section 1</h2>
        <p>This is the content for Section 1.</p>
    </div>

    <div id="section2">
        <h2>Section 2</h2>
        <p>This is the content for Section 2.</p>
    </div>

    <div id="section3">
        <h2>Section 3</h2>
        <p>This is the content for Section 3.</p>
    </div>
</body>
</html>
