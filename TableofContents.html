<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents</title>
</head>
<body>
    <!-- 
        24. HTML Page with Table of Contents
        Description
        This project demonstrates how to create a table of contents (TOC) that links to sections within the same HTML page. It’s useful for documentation, guides, long articles, or tutorials.
        Features
        •	Clickable internal links (anchor links)
        •	Organized sections with corresponding IDs
        •	Semantic headings for structure and accessibility
    -->
    <style>
        #section1, #section2, #section3,#navbar {
            margin-bottom: 20px;
            height: 300px;
        }
    </style>
    <h1>My Website</h1>
    <div>
        <ul>
            <li><a href="#section1">About</a></li>
            <li><a href="#section2">Services</a></li>
            <li><a href="#section3">Contact</a></li>
        </ul>
    </div>

    <div id="section1">
        <h2>About</h2>
        <p>This is the content for the About section.</p>
    </div>

    <div id="section2">
        <h2>Services</h2>
        <p>This is the content for the Services section.</p>
    </div>

    <div id="section3">
        <h2>Contact</h2>
        <p>This is the content for the Contact section.</p>
    </div>
</body>
</html>
