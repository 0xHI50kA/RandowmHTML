    <title>Photo Gallery</title>

<body>
    <!-- 
        9. Photo Gallery Page 
        Description
        A photo gallery page showcases a collection of images in a simple, organized layout. This project helps you practice using <img> elements, alt text, and visual grouping using basic HTML.
        Features
        •	Page title and optional description
        •	Multiple images in a grid-like layout
        •	Alt text for accessibility
        •	Optional image captions
     -->
    <h1>Photo Gallery</h1>
    <p>Welcome to my photo gallery where i show different gif looks like </p>
    <div >
        <img src="picture/profile.gif" alt="Placeholder image" height="200" width="200">
        <img src="picture/profile4.gif" alt="Description of image 0" height="200" width="200">
        <img src="picture/profile2.gif" alt="Description of image 0" height="200" width="200">
        <br>
        <br>
        <div>
            <img src="picture/image1.gif" alt="Description of image 1">
            <p>Caption for image 1</p>
        </div>
        <div>
            <img src="picture/image2.gif" alt="Description of image 2">
            <p>Caption for image 2</p>
        </div>
        <div>
            <img src="picture/image3.gif" alt="Description of image 3">
            <p>Caption for image 3</p>
        </div>
    </div>
