<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Letter Form</title>
</head>
<body>
    <!-- 12. Newsletter Signup Form 
        Description
        This project focuses on creating a simple email subscription form for a newsletter. It’s a great exercise in collecting user input and structuring small, focused forms.
        Features
        •	Email input field
        •	Name input (optional)
        •	Submit button
        •	Placeholder for confirmation or success message (to enhance later with JavaScript)
    -->
    <h1>Newsletter Signup</h1>
    <p>Subscribe to our newsletter to receive the latest updates and news.</p>
    <form>
        <label for="name">Name (optional):</label>
        <br>
        <input type="text" id="name" name="name" placeholder="Your Name">
        <br><br>
        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="email" placeholder="YourEmail@example.com" required>
        <br><br>
        <button type="submit">Subscribe</button>
    </form>
</body>
</html>
