<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Student Grades</title>
</head>
<body>
    <!-- 
        5. HTML Table with Student Grades - 
        Description
        This project helps you learn how to structure tabular data using HTML <table> elements. You’ll build a simple student grades report with rows and columns.
        Features
        •	Table header row
        •	Student names and subjects
        •	Grades for each student
        •	Basic table layout using <table>, <tr>, <th>, and <td>
     -->

    <h1>Student Grades Report</h1>
    <br>
    <p><strong>Student:</strong> hisoka Morrow</p>
    <p><strong>Date:</strong> 2023-10-01</p>
    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Q1</th>
                <th>Q2</th>
                <th>Q3</th>
                <th>Q4</th>
                <th>Final Grade</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>95</td>
                <td>90</td>
                <td>92</td>
                <td>91</td>
                <td><strong>91.25</strong></td>
                <td><strong>PASSED</strong></td>
            </tr>
            <tr>
                <td>Science</td>
                <td>88</td>
                <td>85</td>
                <td>87</td>
                <td>86.25</td>
                <td><strong>86.25</strong></td>
                <td><strong>PASSED</strong></td>
            </tr>
            <tr>
                <td>History</td>
                <td>92</td>
                <td>90</td>
                <td>91</td>
                <td>91.25</td>
                <td><strong>91.25</strong></td>
                <td><strong>PASSED</strong></td>
            </tr>
            <tr>
                <td>English</td>
                <td>90</td>
                <td>92</td>
                <td>91</td>
                <td>91.25</td>
                <td><strong>91.25</strong></td>
                <td><strong>PASSED</strong></td>
            </tr>
            <tr>
                <td>Average</td>
                <td><strong>91.25</strong></td>
                <td><strong>90.75</strong></td>
                <td><strong>91.25</strong></td>
                <td><strong>91.25</strong></td>
                <td><strong>91.25</strong></td>   
                <td><strong>PASSED</strong></td>
            </tr>
        </tbody>
</body>
</html>
