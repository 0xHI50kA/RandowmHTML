<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Image Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
        }

        .slider {
            width: 700px;
            max-width: 90%;
            overflow: hidden;
            position: relative;
        }

        .slides {
            display: flex;
            width: 300%;
            transition: transform 0.5s ease;
        }

        .slide {
            width: 33.333%;
        }

        .slide img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        /* Hide radio buttons */
        input[type="radio"] {
            display: none;
        }

        /* Slide navigation */

        #slide1:checked ~ .slides {
            transform: translateX(0);
        }

        #slide2:checked ~ .slides {
            transform: translateX(-33.333%);
        }

        #slide3:checked ~ .slides {
            transform: translateX(-66.666%);
        }

        .navigation {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .navigation label {
            width: 15px;
            height: 15px;
            border-radius: 50%;

            background: white;
            border: 2px solid white;

            cursor: pointer;
            opacity: 0.5;

            transition: 0.3s;
        }

        /* Active dot */
        #slide1:checked ~ .navigation label[for="slide1"],
        #slide2:checked ~ .navigation label[for="slide2"],
        #slide3:checked ~ .navigation label[for="slide3"] {
            opacity: 1;
            transform: scale(1.3);
        }
    </style>
</head>

<body>


    <div class="slider">

        <!-- Radio Buttons -->
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">

        <!-- Images -->
        <div class="slides">

            <div class="slide">
                <img src="picture/profile.gif" alt="Image 1">
            </div>

            <div class="slide">
                <img src="picture/profile2.gif" alt="Image 2">
            </div>

            <div class="slide">
                <img src="picture/profile4.gif" alt="Image 3">
            </div>

        </div>

        <!-- Navigation -->
        <div class="navigation">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
        </div>

    </div>

</body>
</html>
