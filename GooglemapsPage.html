<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Page</title>
</head>
<body>
    <!-- 
        22. Simple HTML Page with Google Maps Embed 
        Description
        This project shows how to embed a Google Map on your webpage. It's a common feature for contact pages, business locations, event directions, and more.
        Features
        •	Embedded responsive Google Map
        •	Clean and centered layout
        •	Customizable location
    -->
    <div style="border: 10px solid #ccc; padding: 20px; margin: 20px; text-align: center;">
        <h1>Find Us on the Map</h1>
        <p>Use the map below to locate our office and get directions.</p>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019123456789!2d-122.419415484681!3d37.7749297797596!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c12345678%3A0xabcdef1234567890!2sYour%20Business%20Name!5e0!3m2!1sen!2sus!4v1610000000000" 
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </div>
</body>
</html>
